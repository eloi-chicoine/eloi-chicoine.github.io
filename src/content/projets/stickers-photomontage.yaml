# SAÉ 1.03 — planche en photomontage (Photoshop)
titre:
  fr: "Stickers en photomontage"
  en: "Photomontage stickers"
date: "2025-10"
univers: graphisme
resume:
  fr: "Les mêmes compétences en photomontages décalés, composés sur Photoshop."
  en: "The same skills as offbeat photomontages, composed in Photoshop."
description:
  fr: "La même idée traitée en photomontage : chaque compétence devient une image décalée composée sur Photoshop, à la manière de Jean Lecointre. Détourage, modes de fusion et archives en noir et blanc mêlées à des couleurs franches donnent des métaphores visuelles plus texturées et plus surprenantes. (Projet étudiant fictif)"
  en: "The same idea in photomontage: each skill becomes an offbeat image composed in Photoshop, in the style of Jean Lecointre. Cut-outs, blend modes and black and white archives mixed with bold colours make more textured, more surprising visual metaphors. (Fictional student project)"
outils: ["Photoshop"]
# planche : tous les stickers en grille régulière, sans recadrage
galerie: planche
