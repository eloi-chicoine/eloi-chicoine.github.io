# SAÉ 1.03 — planche vectorielle (Illustrator)
titre:
  fr: "Stickers vectoriels"
  en: "Vector stickers"
date: "2025-10"
univers: graphisme
resume:
  fr: "Mes compétences et mon avatar en stickers vectoriels, dessinés sur Illustrator."
  en: "My skills and my avatar as vector stickers, drawn in Illustrator."
description:
  fr: "Une planche de stickers dessinés sur Illustrator pour représenter mes compétences, hard skills et soft skills, ainsi que mon avatar. Inspirée de l'illustrateur Wood : formes géométriques, aplats de couleurs vives et personnages simplifiés, pour qu'une idée abstraite se lise en un coup d'œil. (Projet étudiant fictif)"
  en: "A sheet of stickers drawn in Illustrator to represent my skills, hard and soft, along with my avatar. Inspired by illustrator Wood: geometric shapes, bold flat colours and simplified characters, so an abstract idea reads at a glance. (Fictional student project)"
outils: ["Illustrator"]
