# Site vitrine d'un café kawaii (maquette)
titre:
  fr: "Neko Café"
  en: "Neko Café"
date: "2026-10"
univers: graphisme
resume:
  fr: "Le site vitrine d’un café kawaii inspiré de la culture japonaise."
  en: "A showcase website for a kawaii café inspired by Japanese culture."
description:
  fr: "La maquette du site vitrine d’un café kawaii imaginaire à Limoges, aux pâtisseries et boissons inspirées de la culture japonaise. À partir d’un moodboard, j’ai construit une identité douce et ludique : palette pastel, formes arrondies, pattes de chat et menu illustré, jusqu’à la carte de localisation et au pied de page. (Projet étudiant fictif)"
  en: "The mock-up of a showcase website for an imaginary kawaii café in Limoges, serving pastries and drinks inspired by Japanese culture. Starting from a moodboard, I built a soft and playful identity: pastel palette, rounded shapes, cat paws and an illustrated menu, all the way to the location map and the footer. (Fictional student project)"
outils: ["Figma"]
# mosaïque : 2 colonnes où les images s'empilent sans trous (formats variés)
galerie: mosaique
