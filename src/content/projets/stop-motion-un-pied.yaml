# SAÉ 1.04 — Produire un contenu audio et vidéo (BUT MMI 1)
titre:
  fr: "Stop motion — Un pied dans un monde meilleur"
  en: "Stop motion — One foot in a better world"
date: "2025-11"
univers: video
resume:
  fr: "Spot publicitaire de 30 secondes en stop motion pour une marque de chaussures."
  en: "A 30-second stop-motion ad for a shoe brand."
description:
  fr: |
    Réaliser en trinôme un spot de 30 secondes en stop motion pour une grande marque de chaussures, sur le slogan « Un pied dans un monde meilleur », avec une voix off en anglais.

    Pré-production : moodboard, écriture de la voix off et storyboard détaillé, pour une direction artistique joyeuse et lumineuse. Tournage en studio au smartphone avec Stop Motion Studio, trépied, fonds colorés et softbox ; rôles répartis entre prise de vue et lumière, animation des objets et script.

    Post-production sur Premiere Pro : montage, étalonnage, sound design et titrage, export HD H.264 pour YouTube. Un making-of commenté de 2 minutes a été ajouté à la dernière minute.
  en: |
    A team of three, a 30-second stop-motion ad for a major shoe brand, on the slogan "One foot in a better world", with an English voice-over.

    Pre-production: moodboard, voice-over script and a detailed storyboard, for a cheerful and bright art direction. Studio shoot on a smartphone with Stop Motion Studio, tripod, coloured backdrops and softbox; roles split between camera and lighting, object animation and continuity.

    Post-production in Premiere Pro: editing, colour grading, sound design and titles, HD H.264 export for YouTube. A 2-minute narrated making-of was added at the last minute.
outils: ["Stop Motion Studio", "Premiere Pro"]
